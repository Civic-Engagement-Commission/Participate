name: "[CI] Test"

on:
  push:
    branches:
      - main
  pull_request:

env:
  RUBY_VERSION: 3.3.11
  NODE_VERSION: 22.14.0
  RAILS_ENV: test
  DATABASE_USERNAME: postgres
  DATABASE_PASSWORD: postgres
  DATABASE_HOST: localhost
  RUBYOPT: "-W:no-deprecated"
  # Chrome stability options for CI
  SELENIUM_DRIVER_ARGS: "--no-sandbox --disable-dev-shm-usage --disable-gpu --headless=new"
  CHROME_VERSION: "139.0.7258.66"

jobs:
  zeitwerk:
    name: Zeitwerk check
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17-alpine
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          POSTGRES_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Setup database
        run: bundle exec rails db:create db:schema:load

      - name: Zeitwerk check
        run: bundle exec rails zeitwerk:check

  rspec:
    name: RSpec
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17-alpine
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          POSTGRES_PASSWORD: postgres

      redis:
        image: redis:8-alpine
        ports:
          - "6379:6379"

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get -f install -y libu2f-udev imagemagick

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Setup ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Show browser versions
        run: |
          google-chrome --version
          chromedriver --version

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Setup database
        run: bundle exec rails db:create db:schema:load

      - name: Precompile assets
        run: |
          npm ci
          bundle exec rake assets:precompile

      - name: Run RSpec
        run: SIMPLECOV=1 CODECOV=1 bundle exec rspec