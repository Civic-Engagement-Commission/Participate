services:
  pg:
    image: postgres:17-alpine
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - DATABASE_NAME=decidim_nyc_development
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis
    volumes:
      - redis-data:/var/lib/redis/data

  app:
    image: ghcr.io/civic-engagement-commission/participate:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    entrypoint: [ "/decidim/entrypoint-develop.sh" ]
    command: [ "/usr/bin/supervisord" ]
    environment:
      - SECRET_KEY_BASE=development-secret
      - DATABASE_HOST=pg
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=decidim_nyc_development
      - RAILS_ENV=development
      - DISABLE_SPRING=1
      - REDIS_URL=redis://redis:6379
      - RAILS_SERVE_STATIC_FILES=true
      - RAILS_LOG_TO_STDOUT=true
      - RAILS_LOG_LEVEL=debug
      - QUEUE_ADAPTER=sidekiq
      - SEED=true
      - ENABLE_RACK_ATTACK=0
    volumes:
      - ./app:/decidim/app
      - ./.bundle:/decidim/.bundle
      - ./config:/decidim/config
      - ./lib:/decidim/lib
      - shared-volume:/decidim/storage
    ports:
      - 3000:3000
    depends_on:
      - pg
      - redis

  sidekiq:
    image: ghcr.io/civic-engagement-commission/participate:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: [ "bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml" ]
    environment:
      - SECRET_KEY_BASE=development-secret
      - DATABASE_HOST=pg
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=decidim_nyc_development
      - RAILS_ENV=development
      - DISABLE_SPRING=1
      - REDIS_URL=redis://redis:6379
      - RAILS_SERVE_STATIC_FILES=true
      - RAILS_LOG_TO_STDOUT=true
      - RAILS_LOG_LEVEL=debug
      - QUEUE_ADAPTER=sidekiq
      - SEED=true
      - ENABLE_RACK_ATTACK=0
    depends_on:
      - app
    volumes:
      - ./app:/decidim/app
      - ./.bundle:/decidim/.bundle
      - ./config:/decidim/config
      - ./lib:/decidim/lib
      - shared-volume:/decidim/storage
    links:
      - pg
      - redis

volumes:
  shared-volume: { }
  pg-data: { }
  redis-data: { }
